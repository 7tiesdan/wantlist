<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="A two-column visual catalogue of 7tiesdan's Discogs wantlist.">
    <title>Wantlist — 7tiesdan</title>
    <link rel="preconnect" href="https://i.discogs.com">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230c0d0f'/%3E%3Ccircle cx='32' cy='32' r='22' fill='%23f3f0e8'/%3E%3Ccircle cx='32' cy='32' r='9' fill='%23ff5c35'/%3E%3Ccircle cx='32' cy='32' r='3' fill='%230c0d0f'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <header class="masthead">
      <div>
        <p class="eyebrow">7tiesdan / Discogs</p>
        <h1>The wantlist.</h1>
      </div>
      <div class="count" aria-label="Wantlist total"><strong id="total">43</strong><span>records wanted</span></div>
    </header>

    <main>
      <div class="list-meta" aria-hidden="true">
        <span>THE SHELF</span><span>UPDATED 24 SEPTEMBER 2026</span>
      </div>
      <section id="grid" class="record-grid" aria-label="Discogs wantlist"></section>
    </main>

    <footer>
      <span>Built from a Discogs export</span>
      <span>Cover art opens the matching release</span>
    </footer>

    <template id="record-template">
      <article class="record-card">
        <a class="cover-link" target="_blank" rel="noreferrer">
          <div class="cover-wrap">
            <img class="cover" alt="" loading="lazy" decoding="async">
            <div class="fallback" aria-hidden="true"><span class="fallback-label"></span><i></i></div>
            <span class="release-no"></span>
          </div>
        </a>
        <div class="details">
          <p class="artist"></p>
          <h2 class="title"></h2>
          <div class="metadata"><span class="year"></span><span class="format"></span></div>
          <p class="label"></p>
          <a class="median" target="_blank" rel="noreferrer"><span>Median</span><strong></strong></a>
        </div>
      </article>
    </template>

    <script src="releases.js"></script>
    <script src="app.js"></script>
  </body>
</html>
